# One-off check: can GitHub read the Worlds schedule and results from Leaguepedia's public API?
# Prints counts only (no team names or results).
name: Probe schedule source
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          q = {"action": "cargoquery", "format": "json", "limit": "500", "tables": "MatchSchedule",
               "fields": "Team1,Team2,DateTime_UTC,BestOf,Winner,Team1Score,Team2Score,Tab,N_MatchInTab,OverviewPage",
               "where": 'OverviewPage LIKE "2026 Season World Championship%"', "order_by": "DateTime_UTC"}
          url = "https://lol.fandom.com/api.php?" + urllib.parse.urlencode(q)
          try:
              r = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "worlds-player schedule (github.com/BlackCelestialDeer)"}), timeout=60)
              d = json.load(r); rows = [x["title"] for x in d.get("cargoquery", [])]
              msg = (f"status {r.status}; rows {len(rows)}; with teams {sum(1 for x in rows if x['Team1'] and x['Team1']!='TBD')}; "
                     f"with winner {sum(1 for x in rows if x['Winner'])}; pages {sorted(set(x['OverviewPage'] for x in rows))}; "
                     f"tabs {sorted(set(x['Tab'] for x in rows))[:12]}; first {rows[0]['DateTime UTC'] if rows else '-'}; last {rows[-1]['DateTime UTC'] if rows else '-'}; error {d.get('error',{}).get('info','')[:80]}")
          except Exception as e:
              msg = f"failed: {e}"
          print("::notice title=leaguepedia::" + msg)
          PY

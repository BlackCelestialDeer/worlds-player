# Temporary (development): dump raw lolesports data to the dev branch.
name: Dump schedule source
on: workflow_dispatch
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          python3 - <<'PY'
          import json, urllib.request
          H = {"x-api-key": "0TvQnueqKa5mxJntVWt0w4LpLfEkrV1Ta8rQBb9Z"}
          B = "https://esports-api.lolesports.com/persisted/gw/"
          get = lambda p: json.load(urllib.request.urlopen(urllib.request.Request(B + p, headers=H), timeout=60))
          lid = [l for l in get("getLeagues?hl=en-GB")["data"]["leagues"] if l["slug"] == "worlds"][0]["id"]
          first = get(f"getSchedule?hl=en-GB&leagueId={lid}")["data"]["schedule"]
          pages = [first]
          for d in ("older", "newer"):
              tok = first["pages"].get(d)
              while tok and len(pages) < 12:
                  s = get(f"getSchedule?hl=en-GB&leagueId={lid}&pageToken={tok}")["data"]["schedule"]
                  pages.append(s); tok = s["pages"].get(d)
          json.dump({"leagueId": lid, "pages": pages}, open("schedule.json", "w"), indent=1)
          teams = {}
          for p in pages:
              for e in p["events"]:
                  if e.get("match") and e.get("startTime","") >= "2026-10-01":
                      for t in e["match"]["teams"]:
                          if t.get("code") and t["code"] != "TBD": teams[t["code"]] = t["name"]
          json.dump(teams, open("teamnames.json", "w"), indent=1)
          PY
          cd .. && git init -q d && cd d && cp ../out/*.json . && git add . && git -c user.name=dump -c user.email=dump@x commit -qm dump && \
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:dev

# Keeps feed.json up to date with Caedrel's uploads during Worlds, so the watch schedule sync can read them.
# YouTube blocks Claude's tools from its RSS feed, but not GitHub's servers.
name: Update feed

on:
  schedule:
    # Off-peak minutes: GitHub delays or skips scheduled runs at :00 and :30 when busy.
    - cron: "13,43 * * * *"
  workflow_dispatch: {}       # also runnable by hand from the Actions tab

permissions:
  contents: write   # commit feed.json
  pages: write      # ask GitHub Pages to republish

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and merge Caedrel's uploads
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.request
          import xml.etree.ElementTree as ET

          CHANNEL = "UCOFiUtKui6-x4T-J7_DgCag"   # @Caedrel (main channel)
          # Two views of the same uploads: YouTube's channel feed regularly fails or lags for hours,
          # the uploads-playlist feed is the backup. Both are read and merged.
          URLS = [f"https://www.youtube.com/feeds/videos.xml?channel_id={CHANNEL}",
                  f"https://www.youtube.com/feeds/videos.xml?playlist_id=UU{CHANNEL[2:]}"]
          NS = {"a": "http://www.w3.org/2005/Atom", "yt": "http://www.youtube.com/xml/schemas/2015"}

          def fetch(url):
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (worlds-player feed)"})
                      return urllib.request.urlopen(req, timeout=30).read()
                  except Exception as e:
                      print(f"{url[-40:]}: attempt {attempt+1} failed: {e}")
                      time.sleep(15)
              return None

          xmls = [x for x in map(fetch, URLS) if x]
          if not xmls:
              # Fail visibly (red in the Actions tab); the next run tries again.
              print("YouTube feeds unavailable; keeping the existing feed.json")
              sys.exit(1)

          fresh = {}
          entries = [e for x in xmls for e in ET.fromstring(x).findall("a:entry", NS)]
          for e in entries:
              vid = e.findtext("yt:videoId", default="", namespaces=NS)
              title = e.findtext("a:title", default="", namespaces=NS)
              published = e.findtext("a:published", default="", namespaces=NS)
              # Every upload since 1 October: titles don't always say "WORLDS"; the sync decides what is a series.
              if vid and published >= "2026-10-01":
                  fresh[vid] = {"id": vid, "title": title, "published": published}

          # Merge with what we already have: the YouTube feed only lists the latest 15 uploads.
          old = {}
          if os.path.exists("feed.json"):
              try:
                  old = {v["id"]: v for v in json.load(open("feed.json")).get("videos", [])}
              except Exception:
                  old = {}
          merged = {**old, **fresh}
          videos = sorted(merged.values(), key=lambda v: v["published"], reverse=True)[:400]

          out = {"channel": "@Caedrel", "channelId": CHANNEL, "videos": videos}
          new_text = json.dumps(out, ensure_ascii=False, indent=1)
          if os.path.exists("feed.json") and open("feed.json").read() == new_text:
              print("no new uploads")
              sys.exit(0)
          open("feed.json", "w").write(new_text)
          print(f"{len(fresh)} uploads in the YouTube feed, {len(videos)} kept in total")
          PY

      - name: Commit and republish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- feed.json && git ls-files --error-unmatch feed.json >/dev/null 2>&1; then
            echo "nothing to commit"; exit 0
          fi
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add feed.json
          git commit -m "Update feed"      # neutral message: no titles in the repo history view
          git push
          # Pushes made by this job don't always trigger a Pages rebuild, so request one explicitly.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || echo "Pages build request skipped"

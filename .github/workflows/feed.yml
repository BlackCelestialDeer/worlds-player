# Keeps feed.json up to date with Caedrel's uploads during Worlds, so the watch schedule sync can read them.
# YouTube blocks Claude's tools from its feeds, but not GitHub's servers.
#
# GitHub starts scheduled jobs only every few hours on a quiet repo (whatever the cron says), so one run
# stays alive for ~5.5 hours and checks every 10 minutes. The next scheduled run queues behind it, which
# gives near-continuous coverage. Free for public repos.
name: Update feed

on:
  schedule:
    - cron: "13 */2 * * *"
  workflow_dispatch: {}       # also runnable by hand from the Actions tab

permissions:
  contents: write   # commit feed.json
  pages: write      # ask GitHub Pages to republish

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - name: Watch Caedrel's uploads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          end=$((SECONDS + 330*60)); fails=0
          while :; do
            echo "== $(date -u +%H:%M) =="
            if python3 scripts/feed.py; then fails=0; else fails=$((fails+1)); fi
            if ! git diff --quiet -- feed.json; then
              git add feed.json
              git commit -q -m "Update feed"      # neutral message: no titles in the repo history view
              git pull -q --rebase && git push -q && \
                gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || echo "push or Pages request skipped"
            fi
            [ $SECONDS -ge $end ] && break
            sleep 600
          done
          # Red in the Actions tab (and an email) only when YouTube was unreachable for the last 30+ minutes.
          [ $fails -lt 3 ]

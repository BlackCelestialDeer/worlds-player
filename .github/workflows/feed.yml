# Keeps the watch schedule's data up to date: Caedrel's uploads (feed.json) and the schedule, results and
# matched YouTube videos (data.json, built by scripts/build.py). The site reads data.json.
#
# GitHub starts scheduled jobs only every few hours on a quiet repo (whatever the cron says), so one run
# stays alive for ~5.5 hours and checks every 10 minutes. The next scheduled run queues behind it, which
# gives near-continuous coverage. Free for public repos.
name: Update data

on:
  schedule:
    - cron: "13 */2 * * *"
  workflow_dispatch:          # also runnable by hand from the Actions tab
    inputs:
      once:
        description: "Single check instead of watching for 5.5 hours"
        type: boolean
        default: false

permissions:
  contents: write   # commit feed.json
  pages: write      # ask GitHub Pages to republish

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - name: Watch schedule and uploads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          end=$((SECONDS + 330*60)); fails=0
          while :; do
            echo "== $(date -u +%H:%M) =="
            if python3 scripts/feed.py; then fails=0; else fails=$((fails+1)); fi
            python3 scripts/build.py || fails=$((fails+1))
            for f in feed.json data.json rosters.json; do [ -f "$f" ] && git add "$f"; done
            if ! git diff --cached --quiet; then
              git commit -q -m "Update data"      # neutral message: no titles or results in the repo history view
              git pull -q --rebase && git push -q && \
                gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || echo "push or Pages request skipped"
            fi
            [ "${{ inputs.once }}" = "true" ] && break
            [ $SECONDS -ge $end ] && break
            sleep 600
          done
          # Red in the Actions tab (and an email) only when sources were unreachable for the last 30+ minutes.
          [ $fails -lt 3 ]
